name: publish release
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows_latest:
    name: build, pack & publish
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore

      - name: Publish
        run: dotnet publish "Titled Gui.csproj" -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -p:AssemblyName=Titled-${{ github.ref_name }} -o publish

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: publish/*.exe